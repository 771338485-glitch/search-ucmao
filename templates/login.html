{% extends "_layout.html" %}
{% set active_page = 'login' %}

{% block head %}
    <title>桃白白影视 - 登录页面</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
    <style>
        .login-container {
            max-width: 420px;
            margin: 60px auto;
            padding: 32px;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 20px -4px rgba(15, 148, 136, 0.15);
            border: 1px solid rgba(15, 148, 136, 0.1);
        }
        .login-title {
            text-align: center;
            margin-bottom: 28px;
            color: #0d9488;
            font-weight: 800;
            font-size: 24px;
            letter-spacing: -0.02em;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1f2937;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            font-size: 15px;
            background: #fafafa;
            transition: all 0.2s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: #0d9488;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0d9488 0%, #f59e0b 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(15, 148, 136, 0.2);
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(15, 148, 136, 0.3);
            filter: brightness(1.05);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .error-message {
            color: #dc2626;
            text-align: center;
            margin-bottom: 20px;
            padding: 12px;
            background: rgba(220, 38, 38, 0.08);
            border-radius: 10px;
            font-weight: 500;
        }
    </style>
{% endblock %}

{% block content %}
    <div class="main-content-wrapper">
        <div class="container-fluid-custom">
            <div class="login-container">
                <h2 class="login-title">管理员登录</h2>
                {% if error %}
                    <div class="error-message">{{ error }}</div>
                {% endif %}
                <form method="POST">
                    <div class="form-group">
                        <label for="username">账号</label>
                        <input type="text" id="username" name="username" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn-login">登录</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}

{% block scripts %}
    {{ super() }}
{% endblock %}
