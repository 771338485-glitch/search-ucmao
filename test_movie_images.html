<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影视图片获取测试</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .movie-card {
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }
        .movie-card:hover {
            transform: translateY(-5px);
        }
        .movie-poster {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
        }
        .movie-info {
            padding: 10px;
            background-color: white;
            border-radius: 0 0 8px 8px;
        }
        .loading {
            text-align: center;
            padding: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">影视图片获取测试</h1>
        
        <div class="row mb-4">
            <div class="col-md-4">
                <button class="btn btn-primary w-100" onclick="fetchMovies('电影')">获取电影图片</button>
            </div>
            <div class="col-md-4">
                <button class="btn btn-primary w-100" onclick="fetchMovies('电视剧')">获取电视剧图片</button>
            </div>
            <div class="col-md-4">
                <button class="btn btn-primary w-100" onclick="fetchMovies('动漫')">获取动漫图片</button>
            </div>
        </div>
        
        <div id="loading" class="loading d-none">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">加载中...</span>
            </div>
            <p class="mt-2">正在获取影视数据...</p>
        </div>
        
        <div id="movies-container" class="row"></div>
    </div>
    
    <script>
        function fetchMovies(category) {
            const container = document.getElementById('movies-container');
            const loading = document.getElementById('loading');
            
            container.innerHTML = '';
            loading.classList.remove('d-none');
            
            // 调用API获取热门影视数据
            fetch(`/api/movies/hot?page=1&limit=12&category=${encodeURIComponent(category)}`)
                .then(response => response.json())
                .then(data => {
                    loading.classList.add('d-none');
                    
                    if (data.code === 0 && data.data && data.data.items) {
                        const movies = data.data.items;
                        
                        movies.forEach(movie => {
                            const movieCard = document.createElement('div');
                            movieCard.className = 'col-md-3 movie-card';
                            
                            const posterUrl = movie.cover_url || `https://via.placeholder.com/300x450?text=${encodeURIComponent(movie.title)}`;
                            
                            movieCard.innerHTML = `
                                <div class="card">
                                    <img src="${posterUrl}" class="movie-poster" alt="${movie.title}">
                                    <div class="movie-info">
                                        <h5 class="card-title">${movie.title}</h5>
                                        ${movie.rating ? `<p class="card-text">评分: ${movie.rating}</p>` : ''}
                                        ${movie.release_date ? `<p class="card-text text-muted">${movie.release_date}</p>` : ''}
                                    </div>
                                </div>
                            `;
                            
                            container.appendChild(movieCard);
                        });
                    } else {
                        container.innerHTML = '<div class="col-12 text-center"><p class="text-muted">未获取到影视数据</p></div>';
                    }
                })
                .catch(error => {
                    loading.classList.add('d-none');
                    container.innerHTML = '<div class="col-12 text-center"><p class="text-danger">获取数据失败: ' + error.message + '</p></div>';
                });
        }
        
        // 页面加载时默认获取电影数据
        window.onload = function() {
            fetchMovies('电影');
        };
    </script>
</body>
</html>
